openapi: 3.0.3
info:
  title: Chromium Build Telemetry API
  description: |
    Self-hosted telemetry for chromium build. Records per-build stats
    (duration, exit code, reclient/ccache hit rate, target, args, platform)
    and serves a Vue dashboard.

    **Base path:** `/api`
    **Auth:** none (corp-network only)

    ## Lifecycle
    1. `POST /api/start`  — emit when `build.sh` begins (with `reclient_enabled=true`).
       Server inserts a row, status=`running`, returns `{id}`.
    2. `POST /api/ingest` — emit when `build.sh` finishes. Pass `build_id` to
       UPDATE the started row (preserves earlier fields). Without `build_id`,
       INSERT a standalone row (legacy path).

    ## Status values
    * `running`   — `/api/start` recorded, `/api/ingest` not yet seen.
    * `finished`  — `/api/ingest` received, build ran to completion.
    * `timeout` — SIGINT (exit_code 130) or SIGTERM (143). Client may
      set `status="timeout"` explicitly; otherwise the server auto-tags
      from exit_code. `exit_code` is normalized to NULL for timeout rows.
  version: "0.3.0"
  contact:
    name: build-telemetry
    url: https://github.com/littlexia4-creator/chromium-build-telemetry

servers:
  - url: http://11.164.90.44:8080
    description: corp-net deployment
  - url: http://localhost:8080
    description: local dev

tags:
  - name: lifecycle
    description: build start / finish ingestion
  - name: query
    description: list / detail
  - name: stats
    description: aggregated dashboard data
  - name: meta
    description: health / utility

paths:

  /api/health:
    get:
      tags: [meta]
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              examples:
                ok:
                  value: { ok: true }

  /api/start:
    post:
      tags: [lifecycle]
      summary: Record a build kickoff
      description: |
        Insert a new row with `status=running` and `started_ts=ts`. Returns the
        generated row id, which the client must echo back as `build_id` on the
        finishing `/api/ingest` call to merge into the same record.
      operationId: startBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
            examples:
              kickoff:
                summary: build kickoff (platform auto-derived from os+arch)
                value:
                  ts: 1730983200
                  email: user@example.com
                  repo: ssh://gerrit/.../desktop
                  branch: main_144
                  commit_sha: abc1234
                  os: linux
                  arch: x86_64
                  ncpu: 64
                  build_type: Debug
                  target: chrome
                  args: "-d --reclient"
                  chromium_src_dir: /home/user/chromium/src
                  OUTPUT_DIR: out/Debug
                  reclient_enabled: true
      responses:
        "200":
          description: row inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
              examples:
                ok: { value: { id: 42 } }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/ingest:
    post:
      tags: [lifecycle]
      summary: Record build finish stats
      description: |
        Two modes:
        * **Update mode** — body contains `build_id`. UPDATE the row with that
          id; only fields present in the payload are overwritten (Nones skipped
          so /api/start data is preserved). Sets `status='finished'`,
          `finished_ts=now()`.
        * **Insert mode** — no `build_id`. INSERT a new row. Used as fallback
          if `/api/start` was skipped or failed.
      operationId: ingestBuild
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
            examples:
              finish:
                summary: pair with /api/start via build_id (recommended path)
                description: |
                  Server applies UPDATE on row #42. Identity fields set by
                  /api/start (email, branch, chromium_src_dir, OUTPUT_DIR,
                  reclient_enabled, ncpu, ...) are PRESERVED — only the keys
                  present below are overwritten. Repeating `os`/`arch` here
                  is harmless (idempotent overwrite) and heals the row if
                  /api/start was truncated.

                  Field notes:
                  * `total_time` ≥ `ninja_total_time`. Delta = gn gen +
                    reproxy bootstrap + setup overhead.
                  * `exit_code = 0` success; `>=130` is signal-killed
                    (e.g. 130 = SIGINT / Ctrl-C, 137 = SIGKILL).
                  * `rbe.total_actions = hits + misses + local_fallback`
                    in well-behaved builds.
                  * `ccache.size_kib` is current on-disk usage; it should
                    be < `CCACHE_MAXSIZE` or eviction will kick in.
                value:
                  build_id: 42
                  ts: 1730984591                    # unix epoch at build.sh exit
                  os: linux                         # idempotent — heals row if /api/start truncated
                  arch: x86_64
                  start: "2026/05/09 10:00:00"      # ISO display from build.sh
                  end:   "2026/05/09 10:23:11"
                  total_time: 1391                  # 23m11s — whole script
                  ninja_total_time: 1305            # 21m45s — ninja phase only
                  exit_code: 0
                  rbe:
                    hits: 12000
                    misses: 800
                    local_fallback: 12
                    total_actions: 12812
                  ccache:
                    direct_hit: 8200
                    preproc_hit: 250
                    miss: 612
                    size_kib: 50331648              # ~48 GiB cache used
                    CCACHE_MAXSIZE: "96GiB"
      responses:
        "200":
          description: row inserted or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"
              examples:
                updated: { value: { id: 42, updated: true } }
                inserted: { value: { id: 43, updated: false } }
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/builds:
    get:
      tags: [query]
      summary: List builds (paginated, filterable)
      operationId: listBuilds
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: user
          description: exact match on `user_email`
          schema: { type: string }
        - in: query
          name: platform
          schema: { type: string }
        - in: query
          name: exit_code
          schema: { type: integer }
        - in: query
          name: status
          schema: { type: string, enum: [running, finished, timeout] }
        - in: query
          name: since
          description: unix epoch seconds; rows with `ts >= since`
          schema: { type: integer }
        - in: query
          name: kind
          description: |
            Optional full/incremental filter. Rows with a client-reported
            `is_full` flag use it directly; legacy rows (is_full NULL) fall
            back to the ccache heuristic: `full` → total cacheable calls
            (direct+preproc+miss) > 46000, `incremental` → the complement.
          schema: { type: string, enum: [full, incremental] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildList"

  /api/builds/{build_id}:
    get:
      tags: [query]
      summary: Single build with full row + raw payload
      operationId: getBuild
      parameters:
        - in: path
          name: build_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/stats/summary:
    get:
      tags: [stats]
      summary: Top-level dashboard cards
      operationId: statsSummary
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, default: 30 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"

  /api/stats/timeseries:
    get:
      tags: [stats]
      summary: Per-day build counts + average time
      operationId: statsTimeseries
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, default: 14 }
        - in: query
          name: kind
          description: |
            Optional filter. Rows with a client-reported `is_full` flag use it
            directly; legacy rows fall back to the ccache heuristic (total
            cacheable calls > 46000 → `full`, else `incremental`). Omit to get
            all rows. `Inc + Full = All` per day.
          schema: { type: string, enum: [full, incremental] }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TsPoint" }

  /api/stats/by_user:
    get:
      tags: [stats]
      summary: Top users by build count
      operationId: statsByUser
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, default: 14 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserStat" }

  /api/stats/by_platform:
    get:
      tags: [stats]
      summary: Build counts grouped by platform
      operationId: statsByPlatform
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, default: 14 }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatStat" }

  /api/stats/distinct:
    get:
      tags: [stats]
      summary: Distinct values for filter dropdowns
      operationId: statsDistinct
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distinct"

components:

  responses:
    BadRequest:
      description: invalid request body
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:

    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: true }

    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string, example: "build_id 42 not found" }

    RbeStats:
      type: object
      properties:
        hits:               { type: integer, nullable: true, description: "STATUS_REMOTE_CACHE_HIT" }
        misses:             { type: integer, nullable: true, description: "remote miss (= STATUS_REMOTE_EXECUTION)" }
        remote_executions:  { type: integer, nullable: true, description: "STATUS_REMOTE_EXECUTION (alias of `misses` for clarity)" }
        local_fallback:     { type: integer, nullable: true, description: "STATUS_LOCAL_FALLBACK only" }
        local_failures:     { type: integer, nullable: true, description: "STATUS_NON_ZERO_EXIT + STATUS_LOCAL_EXECUTION + STATUS_RACING_LOCAL — i.e. what reproxystatus reports as `N local failures`" }
        local_executions:   { type: integer, nullable: true, description: "legacy alias of `local_failures` (back-compat)" }
        total_actions:      { type: integer, nullable: true }

    CcacheStats:
      type: object
      properties:
        direct_hit:     { type: integer, nullable: true }
        preproc_hit:    { type: integer, nullable: true }
        miss:           { type: integer, nullable: true }
        size_kib:       { type: integer, nullable: true, description: current cache size, KiB }
        CCACHE_MAXSIZE:
          type: string
          nullable: true
          description: |
            Configured ccache max size, exact value of `CCACHE_MAXSIZE` env var
            (e.g. `96GiB`, `100G`, `5000000K`). Stored as text so unit suffix
            is preserved.
          example: "96GiB"
        maxsize:
          type: string
          nullable: true
          description: alias of `CCACHE_MAXSIZE`
        max_size:
          type: string
          nullable: true
          description: legacy alias of `CCACHE_MAXSIZE` (back-compat)

    StartRequest:
      type: object
      description: |
        Common build identification fields. All optional except none —
        anything missing is stored as NULL. The server reads `ts` (unix epoch
        seconds; defaults to server time if omitted) and uses it as `started_ts`.
      properties:
        ts:               { type: integer, description: unix epoch seconds }
        email:            { type: string, format: email }
        repo:             { type: string }
        branch:           { type: string }
        commit_sha:       { type: string }
        platform:         { type: string, example: linux-x86_64, description: "free-form host label. If omitted but `os` + `arch` are provided, server auto-derives `${os}-${arch}`. Prefer sending only `os` + `arch` from new clients." }
        os:               { type: string, example: linux,    description: "host operating system kernel name (linux/darwin/mingw)" }
        arch:             { type: string, example: x86_64,   description: "host CPU architecture (x86_64/arm64/...)" }
        ncpu:             { type: integer }
        build_type:       { type: string, example: Debug }
        browser_type:     { type: string, example: quark, description: "set by build.sh: quark / ucbrowser / u4shell" }
        target:           { type: string }
        args:             { type: string }
        OUTPUT_DIR:       { type: string, example: out/Debug, description: "build output directory relative to `chromium_src_dir`" }
        output_dir:       { type: string, description: alias of `OUTPUT_DIR` (lowercase) }
        out_dir:          { type: string, description: alias of `OUTPUT_DIR` }
        chromium_src_dir: { type: string, example: /home/user/chromium/src, description: "absolute path to chromium src tree on the builder" }
        src_dir:          { type: string, description: alias of `chromium_src_dir` }
        dir:              { type: string, description: legacy alias of `chromium_src_dir` (back-compat with old build.sh) }
        reclient_enabled: { type: boolean }
        is_full_build:    { type: boolean, description: "client-detected build scope: true when the out dir compiles from scratch (--clean, or missing/header-only .ninja_log). Detected BEFORE ninja runs so it stays correct for builds that fail early. `is_full` accepted as alias." }
        # rbe/ccache rarely useful at start time but accepted
        rbe:    { $ref: "#/components/schemas/RbeStats" }
        ccache: { $ref: "#/components/schemas/CcacheStats" }

    StartResponse:
      type: object
      required: [id]
      properties:
        id: { type: integer, example: 42 }

    IngestRequest:
      allOf:
        - $ref: "#/components/schemas/StartRequest"
        - type: object
          properties:
            build_id:         { type: integer, description: pair with /api/start row }
            start:            { type: string, description: ISO timestamp at script entry }
            end:              { type: string, description: ISO timestamp at script exit }
            total_time:       { type: integer, description: whole-script seconds }
            ninja_total_time: { type: integer, description: ninja phase seconds }
            ninja_time:       { type: integer, description: alias of `ninja_total_time` }
            exit_code:        { type: integer }
            # convenience flat aliases
            rbe_hits:           { type: integer }
            rbe_misses:         { type: integer }
            rbe_local_fallback:    { type: integer }
            rbe_remote_executions: { type: integer }
            rbe_local_failures:    { type: integer }
            rbe_local_executions:  { type: integer, description: "legacy alias of `rbe_local_failures`" }
            browser_type:          { type: string, description: "quark / ucbrowser / u4shell" }
            status:                { type: string, enum: [ok, finished, failed, timeout, running], description: "client-tagged outcome. SIGINT/SIGTERM (exit_code 130/143) auto-tag as `timeout` server-side if omitted." }
            rbe_total_actions:  { type: integer }
            ccache_direct_hit:  { type: integer }
            ccache_preproc_hit: { type: integer }
            ccache_miss:        { type: integer }
            ccache_size_kib:    { type: integer }
            ccache_maxsize:     { type: string, description: flat alias of `ccache.CCACHE_MAXSIZE` }
            ccache_max_size:    { type: string, description: legacy alias (back-compat); prefer `ccache_maxsize` }

    IngestResponse:
      type: object
      required: [id, updated]
      properties:
        id:      { type: integer, example: 42 }
        updated: { type: boolean, example: true, description: true=UPDATE, false=INSERT }

    BuildRow:
      type: object
      properties:
        id:                 { type: integer }
        ts:                 { type: integer, description: unix epoch seconds }
        started_ts:         { type: integer, nullable: true }
        finished_ts:        { type: integer, nullable: true }
        status:             { type: string, enum: [running, finished, timeout], nullable: true }
        user_email:         { type: string, nullable: true }
        platform:           { type: string, nullable: true }
        build_type:         { type: string, nullable: true }
        browser_type:       { type: string, nullable: true, description: "quark / ucbrowser / u4shell" }
        target:             { type: string, nullable: true }
        total_time:         { type: integer, nullable: true }
        ninja_time:         { type: integer, nullable: true }
        exit_code:          { type: integer, nullable: true }
        reclient_enabled:   { type: integer, nullable: true, enum: [0, 1] }
        is_full:            { type: integer, nullable: true, enum: [0, 1], description: "client-reported full-build flag; NULL for rows from older clients" }
        is_full_effective:  { type: integer, enum: [0, 1], description: "is_full when present, else the ccache-threshold heuristic — the value the kind filter and full-build stats actually use" }
        rbe_hits:               { type: integer, nullable: true }
        rbe_misses:             { type: integer, nullable: true }
        rbe_remote_executions:  { type: integer, nullable: true }
        rbe_local_fallback:     { type: integer, nullable: true }
        rbe_local_failures:     { type: integer, nullable: true }
        ccache_direct_hit:      { type: integer, nullable: true }
        ccache_preproc_hit:     { type: integer, nullable: true }
        ccache_miss:            { type: integer, nullable: true }

    BuildDetail:
      allOf:
        - $ref: "#/components/schemas/BuildRow"
        - type: object
          properties:
            repo:               { type: string, nullable: true }
            branch:             { type: string, nullable: true }
            commit_sha:         { type: string, nullable: true }
            os:                 { type: string, nullable: true }
            arch:               { type: string, nullable: true }
            ncpu:               { type: integer, nullable: true }
            args:               { type: string, nullable: true }
            output_dir:         { type: string, nullable: true, description: "OUTPUT_DIR (e.g. `out/Debug`)" }
            chromium_src_dir:   { type: string, nullable: true, description: "absolute path to chromium src tree" }
            start_ts:           { type: string, nullable: true, description: ISO display string from build.sh }
            end_ts:             { type: string, nullable: true }
            rbe_total_actions:  { type: integer, nullable: true }
            ccache_size_kib:    { type: integer, nullable: true }
            ccache_maxsize:     { type: string,  nullable: true, description: configured CCACHE_MAXSIZE (e.g. "96GiB") }
            raw:
              type: object
              description: original JSON payload as received
              additionalProperties: true

    BuildList:
      type: object
      required: [total, items]
      properties:
        total: { type: integer, description: total matching rows (pre-pagination) }
        items:
          type: array
          items: { $ref: "#/components/schemas/BuildRow" }

    Summary:
      type: object
      required: [days, total, success, fail, timeout, running, success_rate, avg_total_time, avg_ninja_time, rbe_hit_rate, ccache_hit_rate]
      properties:
        days:                { type: integer }
        total:               { type: integer }
        success:             { type: integer, description: "rows with exit_code=0 AND status != timeout" }
        fail:                { type: integer, description: "total - success - running - timeout" }
        timeout:           { type: integer, description: "rows with status=timeout (SIGINT/SIGTERM-killed or stuck >24h)" }
        running:             { type: integer, description: "rows with status=running (any time)" }
        success_rate:        { type: number, format: float, description: "percent. Denominator excludes timeout + running." }
        avg_total_time:      { type: number, format: float, description: "seconds, 3dp" }
        avg_ninja_time:      { type: number, format: float, description: "seconds, 3dp" }
        avg_full_build_time: { type: number, format: float, nullable: true, description: "avg total_time WHERE rbe_total_actions > 46000 (full build threshold). NULL when no full builds in window." }
        rbe_hit_rate:        { type: number, format: float, description: "percent" }
        ccache_hit_rate:     { type: number, format: float, description: "percent" }

    TsPoint:
      type: object
      properties:
        day:       { type: string, example: "2026-05-08", description: local date }
        total:     { type: integer }
        success:   { type: integer }
        avg_total: { type: number, format: float }

    UserStat:
      type: object
      properties:
        user:      { type: string }
        total:     { type: integer }
        success:   { type: integer }
        avg_total: { type: number, format: float }

    PlatStat:
      type: object
      properties:
        platform: { type: string }
        total:    { type: integer }

    Distinct:
      type: object
      required: [users, platforms]
      properties:
        users:     { type: array, items: { type: string } }
        platforms: { type: array, items: { type: string } }
